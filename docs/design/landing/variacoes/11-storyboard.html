.p .char .bubbles { display: none; }
.p .char { left: 50%; margin-left: -300px; top: 110px; transform: scale(.62); transform-origin: top center; }

.s1 { background: #FBF6EE; color: #26211B; } .s1 .time { color: #26211B; }

.s1 .door::after { content: ''; position: absolute; right: 16px; top: 150px; width: 10px; height: 10px; border-radius: 50%; background: #26211B; }
.s1 .plant { position: absolute; right: 30px; bottom: 0; width: 70px; height: 120px; border-radius: 40px 40px 6px 6px; background: #8FBF92; border: 3px solid #26211B; border-bottom: 0; }
/* 2: no ônibus */

.s2 .win em { position: absolute; width: 6px; height: 6px; border-radius: 2px; background: #ffd27a; opacity: .8; }
.s2 .seat { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: #0f1420; }
.s2 .char { --ln: #F3EEE6; --ft: #26211B; --face: #F3EEE6; --hair: #3A322B; }

.s3 .table { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #C98D5E; border-top: 4px solid #8c5c3a; z-index: 3; }
