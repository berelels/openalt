# Compila o app Android (android/, fork do Moonlight) e roda os testes de unidade.
# O ambiente de nuvem do Claude não alcança dl.google.com (SDK, NDK e o plugin Android do Gradle),
# então a prova de que compila vem daqui. O APK de debug fica como artefato da execução.
name: android

on:
  push:
    paths: ['android/**', '.gitmodules', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.gitmodules', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # O NDK na versão do app/build.gradle; a plataforma e o build-tools o próprio Gradle baixa
      - name: NDK pedido pelo app/build.gradle
        run: |
          ndk=$(sed -n 's/^ *ndkVersion "\(.*\)"/\1/p' app/build.gradle)
          echo "NDK $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - name: Compilar (debug) e testes de unidade
        run: ./gradlew --no-daemon assembleNonRootDebug testNonRootDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: openalt-apk-debug
          path: android/app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-unidade
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
